    alpha: "#f56d18"       # Alpha cells - orange
    beta: "#ff0000"        # Beta cells - red
    delta: "#8B4789"       # Delta cells - dark purple
    ductal: "#25e907"      # Ductal cells - green
    endothelial: "#ea7b95" # Endothelial cells - pink
    gamma: "#FFD700"       # Gamma/PP cells - gold
    macrophage: "#8B4513"  # Macrophages - brown
    naiveTc: "#ADD8E6"     # Naive T cells - light blue
    neutrophil: "#708090"  # Neutrophils - slate gray
    otherimmune: "#999999" # Other immune - gray
