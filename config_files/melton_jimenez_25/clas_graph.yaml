wandb:
  use: True
  project_name: GTLongRange_CosmXPancreas
model:
  local_component:
    name: GCN
  global_component:
    name: self-attn-transformer
    parameters:
      max_seq_len: 3000
      dropout_global: 0.3
  decoder:
    type: linear
  save: /dss/dssfs03/tumdss/pn36po/pn36po-dss-0002/di93tig/Projects/A3_InterScale/results/cosmx_pancreas/
optim:
  lr: 0.001
  loss: WeightedCE
  seed: 44
dataset:
  h5ad_data: /dss/dssfs03/tumdss/pn36po/pn36po-dss-0002/di93tig/Projects/A3_InterScale/data/melton25.h5ad
  name: melton25
  prediction_task: classification
  prediction_obs: condition
  prediction_level: graph
  sample_key: ['sliding_window_square']
  group_label: condition
  spatial_neigbors_kwargs:
    radius: 110
    library_key: slide_fov
  batch_size: 32
  pct_mask_nodes: 0.3
