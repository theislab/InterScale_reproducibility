# Damond et al. 2019 — graph-level classification.
# Diabetes-stage label prediction (Non-diabetic vs. Onset vs. Long-duration
# Type 1 Diabetes) per graph, on the CODEX/IMC pancreas islet data.
# Source: notebooks/damond_19/IMC_graph_class_performance.ipynb
# Output: figures/graph_classification/damond19/

dataset: damond19
prediction_level: graph          # selects figures/graph_classification/
sweep_goal: robustness

classes:
  - Long-duration
  - Non-diabetic
  - Onset

wandb:
  entity: francesca-drummer
  project: InterScale_hyperparameter_sweep
  sweeps:
    # local component only
    GCN:
      id: pzz25qfw
      local: true
      global: false
    # global component only
    PCATransformer:
      id: 8jvwjnba
      local: false
      global: true
    # local + global (combined)
    InterScale:
      id: 463vbe99
      local: true
      global: true

# Panel shown in the notebook's plot_f1_across_seeds call: radius=0 (no
# neighborhood expansion) and pct_mask_nodes=0.0 (no masking) — unlike the
# chen22 graph sweeps, this dataset's graph-level runs do report a radius,
# so it is a real value here, not NaN, and the default dropna: true applies.
filters:
  radius: 0
  pct_mask_nodes: 0.0

figures:
  - name: robustness_test_acc
    fn: plot_robustness
    metric: test_acc
    per_model: true          # one panel per model in wandb.sweeps

  - name: f1_across_seeds
    fn: plot_f1_across_seeds
    height: 6
    aspect: 0.9

  - name: overall_test_acc
    fn: plot_overall_metric_comparison
    metric: test_acc
    figsize: [3, 5]

  # Not in the original notebook; added for parity with chen22_graph.
  - name: class_f1_comparison
    fn: plot_class_f1_comparison
