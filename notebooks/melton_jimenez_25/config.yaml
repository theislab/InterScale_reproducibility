dataset:
    value:
        batch_size: 32
        description: ""
        group_label: null
        h5ad_data: /lustre/groups/ml01/projects/2024_spatial_long_range_GT_francesca.drummer/data/cosmx_pancreas.h5ad
        layer_key: null
        name: melton25
        num_classes: -1
        num_features: -1
        pct_mask_nodes: 0.1
        prediction_level: graph
        prediction_obs: condition
        prediction_task: classification
        sample_key:
            - sliding_window_square
            - sliding_window_v
        segmentation_robustness: null
        spatial_neigbors_kwargs:
            coord_type: generic
            library_key: slide_fov
            n_neighs: 6
            radius: 110
        split_key: split
        stratify_group: null
        test_size: 0.1
        train_size: 0.7
        val_size: 0.2
dataset.pct_mask_nodes:
    value: 0.1
dataset.spatial_neigbors_kwargs.radius:
    value: 150
model:
    value:
        decoder:
            dropout_decoder: 0.1
            hidden_dims:
                - 256
                - 128
            type: linear
        global_component:
            load: null
            name: self-attn-transformer
            parameters:
                activation_func: relu
                dim_feedforward: 256
                dropout_global: 0.3
                long_range_attention: false
                max_seq_len: 3000
                n_heads: 4
                num_layers: 2
        local_component:
            load: null
            name: GCN
            parameters:
                dropout_local: 0.1
                hidden_dim: 256
                num_layers: 2
        loss: null
        n_embed: 16
        save: /lustre/groups/ml01/projects/2024_spatial_long_range_GT_francesca.drummer/results/melton25/
optim:
    value:
        cross_corr: cell
        early_stopping: true
        loss: WeightedCE
        lr: 0.001
        lr_max_epochs: 100
        lr_scheduler: CosineWarmupScheduler
        lr_warmup: 20
        n_epochs: 100
        seed: 44
        wd: 0.0001
optim.seed:
    value: 43
wandb:
    value:
        project_name: GTLongRange_CosmXPancreas
        use: true
